name: Parting
description: >-
  Parting operates parting.com, a consumer-facing funeral-home and cremation
  price-comparison platform that indexes more than 15,000 funeral homes and
  mortuaries across all 50 U.S. states, letting families research locations,
  photos, reviews, and pricing and contact providers directly. Founded in 2015
  and based in Los Angeles, the company also publishes Parting Pro
  (partingpro.com), funeral-home arrangement and cremation software with
  third-party integrations to Passare, Keeper, and QuickBooks. As of this
  enrichment pass Parting exposes no public developer API, OpenAPI/spec surface,
  SDKs, or developer portal; this profile captures its public web presence and
  a domain-security probe.
